name: Build Fire TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Create and configure Android project for Fire TV
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/configure-firetv.mjs
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v7
        with:
          name: BharatStream-FireTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
