name: Build Fire TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Create and configure Android project for Fire TV
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/configure-firetv.mjs
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatStream-FireTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
